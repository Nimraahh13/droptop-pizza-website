<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | Drop & Top</title>

  <link rel="stylesheet" href="../css/style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js"></script>
</head>

<body>

  <main class="container">
    <div class="auth-card">

      <h1>Reset Password</h1>

      <form id="reset-form">

        <label for="password">New Password</label>

        <input
          type="password"
          id="password"
          placeholder="Enter new password"
          required
          minlength="6"
        >

        <label for="confirm-password">Confirm Password</label>

        <input
          type="password"
          id="confirm-password"
          placeholder="Confirm new password"
          required
          minlength="6"
        >

        <button type="submit" class="btn">
          Update Password
        </button>

        <p id="message"></p>

      </form>

    </div>
  </main>

  <script>
    
const form = document.getElementById('reset-form');
const message = document.getElementById('message');

let recoverySession = null;

async function initPasswordRecovery() {

  // 1. Check if Supabase recovery tokens are present in URL
  const hash = new URLSearchParams(window.location.hash.substring(1));

  const access_token = hash.get('access_token');
  const refresh_token = hash.get('refresh_token');

  if (access_token && refresh_token) {
    const { data, error } = await db.auth.setSession({
      access_token: access_token,
      refresh_token: refresh_token
    });

    if (error) {
      message.textContent = error.message;
      return;
    }

    recoverySession = data.session;

    // Remove tokens from address bar
    history.replaceState(
      null,
      '',
      window.location.pathname
    );
  }

  // 2. Get current session
  const { data: sessionData } = await db.auth.getSession();

  if (sessionData.session) {
    recoverySession = sessionData.session;
    return;
  }

  message.textContent =
    'Reset link is invalid or expired. Please request a new password reset email.';
}


// 3. Listen for Supabase password recovery event
db.auth.onAuthStateChange((event, session) => {

  if (event === 'PASSWORD_RECOVERY') {
    recoverySession = session;
    message.textContent = '';
  }

});


// 4. Update password
form.addEventListener('submit', async (e) => {

  e.preventDefault();

  const password = document.getElementById('password').value;
  const confirm = document.getElementById('confirm-password').value;

  if (password !== confirm) {
    message.textContent = 'Passwords do not match!';
    return;
  }

  if (password.length < 6) {
    message.textContent = 'Password must be at least 6 characters.';
    return;
  }

  const { error } = await db.auth.updateUser({
    password: password
  });

  if (error) {
    message.textContent = error.message;
    return;
  }

  message.textContent = 'Password updated successfully!';

  setTimeout(() => {
    window.location.href = 'login.html';
  }, 1500);

});


// Start recovery process
initPasswordRecovery();

  </script>

</body>
</html>
